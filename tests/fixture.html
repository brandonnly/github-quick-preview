<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>GitHub Quick Preview checks</title>
<style>
  body { margin: 0; background: #0d1117; color: #e6edf3; font: 16px system-ui; }
  article { width: 700px; max-width: 90%; margin: 100px auto; }
  table { width: 100%; } td { width: 50%; }
  img { max-width: 100%; vertical-align: middle; }
  a:focus-visible { outline: 2px solid #80bfff; }
</style>
<article class="markdown-body">
  <h1>Screenshot gallery</h1>
  <table><tr><th>Before</th><th>After</th></tr><tr>
    <td><a id="before" href="#before"><img id="one" src="/tests/images/before.svg" alt="Before desktop" width="300"></a></td>
    <td><a id="after" href="#after"><img id="two" src="/tests/images/after.svg" alt="After desktop" width="300"></a></td>
  </tr></table>
  <p><a id="mobile" href="#mobile"><img id="three" src="/tests/images/mobile.svg" alt="Mobile" width="140"></a></p>
  <img id="badge" src="/tests/images/badge.svg" alt="Build passing"><img class="emoji" id="emoji" src="/tests/images/badge.svg" alt="emoji">
  <details><summary>Hidden</summary><img id="hidden" src="/tests/images/before.svg" alt="Hidden screenshot"></details>
  <div style="height:1500px"></div>
</article>
<script>
  history.replaceState({}, "", "/example/repository/pull/1");
  window.fixtureReady = Promise.all([...document.querySelectorAll("img")].map(image => image.decode()));
</script>
<script src="/extension/preview.js"></script>
</html>
